# Models Configuration - LM Studio (本地)
models:
  lmstudio-local:
    provider: lmstudio
    litellm_model: openai/lmstudio-model
    enabled: true
    capabilities:
      quality: 5
      cost: 10
      context: 128000
    supported_tasks: [coding, code_review, writing, creative, reasoning, analysis, explanation, translation, chat, brainstorming]
    difficulty_support: [easy, medium]

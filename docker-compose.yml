services:
  smart-router:
    # 如需本地构建，取消注释 build 部分；如需从 Docker Hub 拉取，注释 build 并修改 image
    build:
      context: .
      dockerfile: Dockerfile
    image: smartrouter:latest
    # image: your-dockerhub-username/smartrouter:latest
    container_name: smart-router
    ports:
      # 4000: Proxy API 服务（OpenAI 兼容接口）
      - "4000:4000"
      # 8080: Web Dashboard 管理界面
      - "8080:8080"
    environment:
      # 必须设置：服务主密钥（用于 API 认证）
      - SMART_ROUTER_MASTER_KEY=${SMART_ROUTER_MASTER_KEY:?错误：请设置 SMART_ROUTER_MASTER_KEY 环境变量}
      # 可选：修改监听地址和端口（容器内通常保持默认即可）
      - SMART_ROUTER_HOST=0.0.0.0
      - SMART_ROUTER_PORT=4000
      # 各 Provider 的 API Key（根据你的 providers.yaml 配置添加）
      # 示例（请替换为真实密钥或从 .env 文件加载）：
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - ALIYUN_API_KEY=${ALIYUN_API_KEY}
      # - ZHIPU_API_KEY=${ZHIPU_API_KEY}
    volumes:
      # 挂载配置目录（包含 providers.yaml, models.yaml, routing.yaml）
      - ./config:/app/config:ro
      # 可选：持久化日志
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
